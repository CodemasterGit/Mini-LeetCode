<!DOCTYPE html>
<html>
<head>
    <title>Register - Mini LeetCode</title>
</head>
<body>
    <header>
        <h1>Mini LeetCode</h1>
        <p>Create your account</p>
    </header>
    <main>
        <h2>Register</h2>
        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create your password" required>
            <br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter your age" required>
            <br><br>
            <p>Choose your preferred programming language:</p>
            <input type="radio" id="cpp" name="language" value="cpp">
            <label for="cpp">C++</label>
            <input type="radio" id="java" name="language" value="java">
            <label for="java">Java</label>
            <input type="radio" id="python" name="language" value="python">
            <label for="python">Python</label>
            <br><br>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the Terms and Conditions</label>
            <br><br>
            <button type="submit">Create account</button>
        </form>
        <p>Alrady have an account?<a href="login.html">Login</a></p>
    </main>
    <footer>
        <p>&copy; 2026 Mini LeetCode</p>
    </footer>
</body>
</html>
